<title>Auditoría Marketplaces — Duérmete Online</title>
<style>
:root { --bg: #F5F2EE; --card: #FFFFFF; --ink: #1A1A1A; --muted: #5A5A5A; --line: #E2DDD6; --accent: #FF9900; --error: #B3261E; }
@media (prefers-color-scheme: dark) { :root { --bg: #171614; --card: #201E1B; --ink: #F5F2EE; --muted: #A9A29A; --line: #35322D; --error: #F2B8B5; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
main { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
h1 { font-size: 20px; margin: 0 0 6px; }
p { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.5; }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; margin-top: 14px; font: inherit; font-size: 16px; font-weight: 600; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #1A1A1A; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.error { color: var(--error); font-size: 14px; margin: 12px 0 0; }
</style>
</head>

<form id="acceso" autocomplete="off">
<h1>Auditoría Marketplaces — Duérmete Online</h1>
<p>Este informe está protegido. Introduce la contraseña para verlo.</p>
<label for="clave">Contraseña</label>
<input id="clave" type="password" required autofocus>
<button id="entrar" type="submit">Ver informe</button>
<p id="error" class="error" hidden>La contraseña no es correcta. Vuelve a intentarlo.</p>
</form>
</main>

const SESION = "roicos-clave-duermete_online";
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function descifrar(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(D.s), iterations: D.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.i) }, llave, bytes(D.d));
  if (!D.z) return new TextDecoder().decode(claro);
  const flujo = new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new TextDecoder().decode(await new Response(flujo).arrayBuffer());
}
function leerSesion() { try { return SESION ? sessionStorage.getItem(SESION) : null; } catch (e) { return null; } }
function guardarSesion(v) { try { if (SESION) { v ? sessionStorage.setItem(SESION, v) : sessionStorage.removeItem(SESION); } } catch (e) {} }
function mostrar(html) { document.open(); document.write(html); document.close(); }
const form = document.getElementById("acceso"), campo = document.getElementById("clave"), boton = document.getElementById("entrar"), error = document.getElementById("error");
function esperando(si) { boton.disabled = si; boton.textContent = si ? "Abriendo…" : "Ver informe"; }
form.addEventListener("submit", async ev => {
  ev.preventDefault();
  esperando(true); error.hidden = true;
  let html;
  try { html = await descifrar(campo.value); }
  catch (e) { error.hidden = false; esperando(false); campo.select(); return; }
  guardarSesion(campo.value);
  mostrar(html);
});
(async () => {
  const guardada = leerSesion();
  if (!guardada) return;
  esperando(true);
  try { mostrar(await descifrar(guardada)); }
  catch (e) { guardarSesion(null); esperando(false); }
})();
})();
